# Build the Linux desktop installers (AppImage + .deb) in the cloud.
# Windows can't run the Linux packaging toolchains (mksquashfs / fpm),
# so this is the release path for Linux assets.
# Run manually: Actions tab -> "Build Linux desktop" -> Run workflow.
name: Build Linux desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install renderer deps
        working-directory: desktop/renderer
        run: npm install

      - name: Build renderer
        working-directory: desktop/renderer
        run: npm run build

      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      - name: Build Linux packages
        working-directory: desktop
        run: npx electron-builder --linux --publish never

      # electron-builder's GitHub publisher refuses releases older than 2 hours,
      # so upload the artifacts directly with the gh CLI instead.
      - name: Upload Linux assets to GitHub release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "HeavyCare ${TAG#v}" --generate-notes
          gh release upload "$TAG" release/*.AppImage release/*.deb release/latest-linux.yml --clobber

# Build the Linux desktop installers (AppImage + .deb) in the cloud.
# The backend is Rust (Tauri 2 with bundled SQLite); Linux bundles must be
# produced on Linux, so this is the release path for Linux assets.
# Run manually: Actions tab -> "Build Linux desktop" -> Run workflow.
name: Build Linux desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Tauri v2 Linux build dependencies (WebKitGTK etc.)
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install renderer deps
        working-directory: desktop/renderer
        run: npm install

      - name: Build renderer
        working-directory: desktop/renderer
        run: npm run build

      - name: Install desktop deps (Tauri CLI)
        working-directory: desktop
        run: npm install

      - name: Build Linux packages (deb + AppImage)
        working-directory: desktop
        run: npx tauri build --bundles deb,appimage

      - name: Upload Linux assets to GitHub release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "HeavyCare ${TAG#v}" --generate-notes
          gh release upload "$TAG" \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            --clobber
